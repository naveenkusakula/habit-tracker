<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Streaks — Daily Habit Tracker</title>
<meta name="description" content="A simple daily habit tracker. Add a habit, mark it done, keep the streak. Free, no account, works offline." />
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='36' fill='none' stroke='%230B57D0' stroke-width='11'/><path d='M35 51 l10 10 l20 -22' fill='none' stroke='%230B57D0' stroke-width='10' stroke-linecap='round'/></svg>" />
</head>
<body>
  <!-- Legacy gradient layers from the old design; kept in the DOM only
       because app.js still references one — CSS hides them for good. -->
  <div class="bg" aria-hidden="true"></div>
  <div class="bg bg-clear" id="bgClear" aria-hidden="true"></div>

  <main class="phone">
    <header>
      <div class="brand">Streaks</div>
      <div class="dateline" id="dateline"></div>
      <div class="hero-card">
        <div class="hero-num"><span id="heroNum">–</span><span class="hero-pct" id="heroPct"></span></div>
        <div class="cond" id="condText"></div>
        <div class="subline" id="subLine"></div>
        <section id="weekSection" hidden>
          <div class="hero-rule"></div>
          <h2 class="week-label">This week</h2>
          <div class="week" id="weekStrip"></div>
        </section>
      </div>
    </header>

    <section>
      <div class="rule"></div>
      <h2 class="sec-label">Do today</h2>
      <div id="doList"></div>
      <p class="empty" id="doEmpty">Nothing here yet — your first habit is one tap away.</p>
    </section>

    <section>
      <div class="rule"></div>
      <h2 class="sec-label">Don&rsquo;t do</h2>
      <div id="avoidList"></div>
      <p class="empty" id="avoidEmpty">Nothing here yet — add something you&rsquo;re quitting.</p>
    </section>

    <p class="foot">Your data never leaves this phone.</p>
  </main>

  <button class="add-pill" id="fab" aria-label="Add a habit">+&ensp;New habit</button>

  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle">New habit</h3>
    <input id="nameInput" type="text" maxlength="60" placeholder="e.g. Read 10 pages"
           autocomplete="off" enterkeyhint="done" />
    <div class="flabel">Type</div>
    <div class="type-row">
      <button type="button" class="type-opt is-active" id="typeDo">✓&ensp;Do it</button>
      <button type="button" class="type-opt" id="typeAvoid">✕&ensp;Don&rsquo;t do it</button>
    </div>
    <div class="flabel">Category</div>
    <div id="catList"></div>
    <div class="sheet-actions">
      <button class="btn-ghost" id="cancelBtn">Cancel</button>
      <button class="btn-solid" id="addBtn">Add habit</button>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
